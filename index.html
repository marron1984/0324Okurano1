<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禅園西梅田 - Instagram Reel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500;600;700;900&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="reel-container" id="reel">

        <!-- Scene 1: HOOK - 衝撃の1秒 (桜セッティング + 店名フラッシュ) -->
        <div class="scene active" id="scene1" data-duration="2500">
            <div class="photo-bg kenburns-zoom-in" style="background-image: url('assets/setting-sakura.jpg')"></div>
            <div class="overlay-gradient-dark"></div>
            <div class="scene-content hook-content">
                <div class="hook-badge">
                    <span>大阪・西梅田</span>
                </div>
                <h1 class="hook-title">
                    <span class="line line-1">知る人ぞ知る</span>
                    <span class="line line-2">隠れ家懐石</span>
                </h1>
                <div class="hook-accent"></div>
            </div>
        </div>

        <!-- Scene 2: 空間の美しさ (テーブルセッティング俯瞰) -->
        <div class="scene" id="scene2" data-duration="3000">
            <div class="photo-bg kenburns-pan-right" style="background-image: url('assets/table-overhead.jpg')"></div>
            <div class="overlay-gradient-bottom"></div>
            <div class="scene-content bottom-text">
                <p class="caption caption-fade">完全個室の贅沢空間</p>
            </div>
        </div>

        <!-- Scene 3: お料理クローズアップ -->
        <div class="scene" id="scene3" data-duration="3000">
            <div class="photo-bg kenburns-zoom-slow" style="background-image: url('assets/dining-closeup.jpg')"></div>
            <div class="overlay-gradient-bottom"></div>
            <div class="scene-content bottom-text">
                <p class="caption caption-fade">旬を味わう懐石料理</p>
            </div>
        </div>

        <!-- Scene 4: 会食の雰囲気 (グループ) -->
        <div class="scene" id="scene4" data-duration="3000">
            <div class="photo-bg kenburns-pan-left" style="background-image: url('assets/dining-group.jpg')"></div>
            <div class="overlay-gradient-bottom"></div>
            <div class="scene-content bottom-text">
                <p class="caption caption-fade">大切な方との特別なひととき</p>
            </div>
        </div>

        <!-- Scene 5: 会話を楽しむ食事 -->
        <div class="scene" id="scene5" data-duration="2500">
            <div class="photo-bg kenburns-zoom-in" style="background-image: url('assets/dining-conversation.jpg')"></div>
            <div class="overlay-vignette"></div>
        </div>

        <!-- Scene 6: カウンター接客 -->
        <div class="scene" id="scene6" data-duration="3000">
            <div class="photo-bg kenburns-pan-right" style="background-image: url('assets/counter-service.jpg')"></div>
            <div class="overlay-gradient-bottom"></div>
            <div class="scene-content bottom-text">
                <p class="caption caption-fade">目の前で仕上げる臨場感</p>
            </div>
        </div>

        <!-- Scene 7: CTA (寿メニュー + 店舗情報) -->
        <div class="scene" id="scene7" data-duration="4000">
            <div class="photo-bg kenburns-zoom-slow" style="background-image: url('assets/celebration-menu.jpg')"></div>
            <div class="overlay-gradient-full"></div>
            <div class="scene-content cta-content">
                <div class="cta-top">
                    <p class="cta-occasion caption-fade">顔合わせ・接待・記念日に</p>
                </div>
                <div class="cta-center">
                    <div class="cta-logo">
                        <span class="cta-name">禅園</span>
                        <span class="cta-sub">西梅田</span>
                    </div>
                </div>
                <div class="cta-bottom">
                    <div class="cta-info caption-fade">
                        <p>西梅田駅 徒歩3分</p>
                    </div>
                    <div class="cta-action caption-fade">
                        <span>ご予約はプロフィールリンクから</span>
                    </div>
                    <div class="cta-handle caption-fade">
                        <span>@zenen_nishiumeda</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Instagram-style Progress Bars -->
        <div class="story-progress" id="storyProgress">
            <div class="progress-segment" data-scene="1"><div class="progress-fill"></div></div>
            <div class="progress-segment" data-scene="2"><div class="progress-fill"></div></div>
            <div class="progress-segment" data-scene="3"><div class="progress-fill"></div></div>
            <div class="progress-segment" data-scene="4"><div class="progress-fill"></div></div>
            <div class="progress-segment" data-scene="5"><div class="progress-fill"></div></div>
            <div class="progress-segment" data-scene="6"><div class="progress-fill"></div></div>
            <div class="progress-segment" data-scene="7"><div class="progress-fill"></div></div>
        </div>

        <!-- Tap Areas -->
        <div class="tap-area tap-left" id="tapLeft"></div>
        <div class="tap-area tap-right" id="tapRight"></div>

        <!-- Sound Toggle (decorative) -->
        <div class="sound-toggle" id="soundToggle">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                <line class="sound-off-line" x1="23" y1="9" x2="17" y2="15"/>
                <line class="sound-off-line" x1="17" y1="9" x2="23" y2="15"/>
            </svg>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
